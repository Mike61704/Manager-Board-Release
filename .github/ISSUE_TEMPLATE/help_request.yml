name: Help request
description: Ask a non-sensitive question about installing or using Manager Board
title: "[Help] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for general, non-sensitive Manager Board questions.

        Before posting, check the built-in Help window and the public SUPPORT.md guidance. This issue will be public, so do not include employee records, organization data, credentials, activation files or codes, workspace or vault data, backups, diagnostic bundles, private URLs, or other sensitive information.

        Activation/licensing questions, security concerns, and cases that require sensitive data should use the private support channel provided with Manager Board.

  - type: input
    id: version
    attributes:
      label: Manager Board version
      placeholder: "Example: 2.1.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: What do you need help with?
      options:
        - Installation
        - Updating Manager Board
        - Startup
        - Dashboard
        - People / 1:1s
        - Daily Work
        - Follow-ups
        - Projects / Workfront
        - Manager Center
        - Notes / Reflections
        - Calendar
        - Files / attachments
        - Backup / restore / recovery
        - Settings / appearance
        - Local AI
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Tell us what you are trying to accomplish and where you are getting stuck.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried? (optional)
      description: Include any built-in Help topic or public support guidance you already checked.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed sensitive business, employee, credential, activation, workspace, backup, vault, and organization information from this public request.
          required: true
