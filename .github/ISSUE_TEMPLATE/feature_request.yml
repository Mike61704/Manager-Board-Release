name: Feature request
description: Suggest an improvement or new capability for Manager Board
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea for Manager Board.

        This is a public issue. Please describe the workflow or need without including employee records, organization data, credentials, activation material, workspace data, backups, vault contents, or other sensitive information.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the management workflow, friction, or limitation behind the request.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like Manager Board to do?
      description: Describe the behavior or capability you would like to see.
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Suggested workflow (optional)
      description: If you have a specific interaction or sequence in mind, describe it here.

  - type: dropdown
    id: area
    attributes:
      label: Area of Manager Board
      options:
        - Dashboard
        - People / 1:1s
        - Daily Work
        - Follow-ups
        - Projects / Workfront
        - Manager Center
        - Notes / Reflections
        - Calendar
        - Files / attachments
        - Backup / restore / recovery
        - Settings / appearance
        - Local AI
        - Updates / installer
        - New area / other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Screenshots or examples are welcome if they are fully redacted and contain no sensitive information.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed sensitive business, employee, credential, activation, workspace, backup, vault, and organization information from this public request.
          required: true
